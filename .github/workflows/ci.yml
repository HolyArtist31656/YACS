name: YACSim CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendordep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25 (Adoptium)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Build, format check, and run JUnit 5 tests
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck build test javadoc

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-reports
          path: vendordep/build/reports/tests/test/