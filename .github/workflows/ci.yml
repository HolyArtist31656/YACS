name: YACSim CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25 (Adoptium)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build, format check, and run JUnit 5 tests
        working-directory: vendordep
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck build test javadoc

      - name: Run Python Onshape & Field exporter unit tests
        run: |
          python3 -m unittest discover -s tools/onshape-exporter -p "test_*.py" -v
          python3 -m unittest discover -s tools/onshape-field-exporter -p "test_*.py" -v

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-reports
          path: vendordep/build/reports/tests/test/
