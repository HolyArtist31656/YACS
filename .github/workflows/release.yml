name: Publish YACSim Vendordep (GitHub Pages)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2027.3.0-alpha1)'
        required: false
        default: '2027.3.0-alpha1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25 (Adoptium)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "value=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build, publish local Maven repo, generate vendordep JSON, and build Javadoc
        working-directory: vendordep
        env:
          releaseVersion: ${{ steps.version.outputs.value }}
        run: |
          chmod +x gradlew
          ./gradlew clean build publish generateVendordepJson javadoc

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p _site/maven/releases _site/vendordeps _site/javadoc
          cp -r vendordep/build/maven/releases/* _site/maven/releases/
          cp vendordep/build/vendordeps/yacsim_commands3.json _site/vendordeps/
          cp -r vendordep/build/docs/javadoc/* _site/javadoc/
          cat << 'HTML' > _site/index.html
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>YACSim — Yet Another CAD Simulator</title>
            <style>
              body { font-family: system-ui, -apple-system, sans-serif; max-width: 780px; margin: 3rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1f2937; }
              h1 { margin-bottom: 0.25rem; }
              .subtitle { color: #4b5563; margin-top: 0; }
              code { background: #f3f4f6; padding: 0.2rem 0.45rem; border-radius: 4px; font-size: 0.92em; word-break: break-all; }
              .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem 1.25rem; margin: 1rem 0; background: #fafafa; }
              ul { padding-left: 1.25rem; }
              a { color: #2563eb; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>YACSim — Yet Another CAD Simulator</h1>
            <p class="subtitle">Lightweight WPILib 2027 (Java 25, Commands v3) 3D CAD simulation vendordep for YAMS and AdvantageScope.</p>

            <div class="card">
              <strong>Online Vendordep URL (WPILib 2027 VS Code):</strong><br>
              <code>https://holyartist31656.github.io/YACS/vendordeps/yacsim_commands3.json</code>
            </div>

            <h2>Links</h2>
            <ul>
              <li><a href="javadoc/">Java API Documentation (Javadoc)</a></li>
              <li><a href="vendordeps/yacsim_commands3.json">yacsim_commands3.json</a></li>
              <li><a href="https://github.com/HolyArtist31656/YACS/blob/main/docs/GETTING_STARTED.md">Getting Started Guide</a></li>
              <li><a href="https://github.com/HolyArtist31656/YACS/blob/main/docs/GUIDES.md">How-To Guides &amp; FRC 6328 Darwin Walkthrough</a></li>
              <li><a href="https://github.com/HolyArtist31656/YACS/blob/main/docs/API_REFERENCE.md">Markdown API Reference</a></li>
              <li><a href="https://github.com/HolyArtist31656/YACS/blob/main/docs/UNIT_TESTS.md">Unit Tests Reference</a></li>
              <li><a href="https://github.com/HolyArtist31656/YACS">GitHub Repository</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4